<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link type="text/css" rel="stylesheet" href="/task_style.css" />
  </head>

  <body>
    <div class="task">
      <div class="description" mark="4">
        В файле находится одна длинная строка состоящаяя из цифр и букв. Считать
        символы из файла и вывести последовательности состощуие только из букв
        или только из цифр каждую с новой строки.
        <div class="example">
          <div class="in">
            123aaa4a77gg4
          </div>
          <div class="out">
            123<br>
            aaa<br>
            4<br>
            a<br>
            77<br>
            gg<br>
            4
          </div>
        </div>
      </div>

      <div class="extras">
        <div class="extra">
            При считывании игнорировать пробелы и новые строки.
                    <div class="example">
          <div class="in">
            1 2 3a a a
          </div>
          <div class="out">
            123<br>
            aaa
          </div>
        </div>
        </div>
      </div>
    </div>
  </body>
</html>
