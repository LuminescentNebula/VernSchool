  <body>
    <div class="task">
      <div class="description" mark="3">
         Протабулировать функцию.

         y = (x^2 - 2x + 2) / (x - 1)
         <br>
         при изменении x от -4 до +4 с шагом 0.5.
      </div>
      <div class="extras">
        <div class="extra">
          С помощью комментарием пояснить что делает каждая строка кода.
          Используйсте оба вида комментариев.
        </div>
        <div class="extra">
          Считать с клавиатуры еще одну переменную и вывести его на экран
          подписав в какой переменной она лежит
        </div>
      </div>
    </div>
  </body>
