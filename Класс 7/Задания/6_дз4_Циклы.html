<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="/task_style.css" />
</head>

<body>
    <div class="task">
        <div class="description" mark="3">
            Ввести числа n и m. Написать программу, которая перебирает целые натуральные числа от n и выводит первое число, которое делится на m.
        </div>
        <div class="example">
            <div class="in">100 17</div>
            <div class="out">102</div>
        </div>
        <div class="extras">
            <div class="extra">
                Для найденного числа вывести все делители (числа, на которые число делится без остатка).
            </div>
            <div class="extra">
                Для найденного числа вывести сумму цифр.
            </div>
        </div>
    </div>
</body>

</html>
